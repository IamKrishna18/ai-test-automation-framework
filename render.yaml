services:
  - type: web
    name: ai-test-automation-framework
    env: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DEFAULT_LLM_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
