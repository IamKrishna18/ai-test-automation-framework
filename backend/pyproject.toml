[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "B008",
    "F821",
    "E501",
    "E722",
    "E741",
    "F841",
    "W",
    "E402"
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
disable_error_code = ["name-defined", "call-arg", "arg-type", "assignment", "var-annotated", "attr-defined", "import-untyped"]
